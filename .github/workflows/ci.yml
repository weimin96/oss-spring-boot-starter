name: Java CI

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - 'main'
      - 'spring3'

permissions:
  contents: read

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:RELEASE.2023-09-04T19-57-37Z
        entrypoint: minio
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    env:
      OSS_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      OSS_TEST_MINIO_ACCESS_KEY: minioadmin
      OSS_TEST_MINIO_SECRET_KEY: minioadmin
      OSS_TEST_MINIO_BUCKET: oss-starter-integration
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

#      - name: Set up Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: '20'
#          cache: npm
#          cache-dependency-path: samples/sample-frontend-web/package-lock.json

      - name: maven-settings-xml-action
        uses: whelk-io/maven-settings-xml-action@v21
        with:
          repositories: ''
          servers: ''

      - name: Wait for MinIO ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO 未在预期时间内启动完成" >&2
          exit 1

      - name: Report Coverage to Coveralls for Pull Requests
        if: github.event_name == 'pull_request'
        run: mvn clean test jacoco:report coveralls:report -Dlicense.skip=true -DrepoToken=$GITHUB_TOKEN -DserviceName=github -DpullRequest=$PR_NUMBER -B package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}

      - name: Report Coverage to Coveralls for General Push
        if: github.event_name == 'push'
        run: mvn clean test jacoco:report coveralls:report -Dlicense.skip=true -DrepoToken=$GITHUB_TOKEN -DserviceName=github -B package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

#      - name: Build front-end sample
#        run: |
#          npm ci --prefix samples/sample-frontend-web
#          npm run build --prefix samples/sample-frontend-web
