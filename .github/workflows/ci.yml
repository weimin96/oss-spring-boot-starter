name: Java CI

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - 'main'
      - 'spring3'

permissions:
  contents: read

jobs:
  build:
    #	配置权限
    permissions: write-all
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:RELEASE.2023-09-04T19-57-37Z
        entrypoint: minio
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    env:
      OSS_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      OSS_TEST_MINIO_ACCESS_KEY: minioadmin
      OSS_TEST_MINIO_SECRET_KEY: minioadmin
      OSS_TEST_MINIO_BUCKET: oss-starter-integration
    steps:
      # 下载代码
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        # 安装 JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # 配置 settings.xml 一般用于 Mavne 私库验证等
      - name: maven-settings-xml-action
        uses: whelk-io/maven-settings-xml-action@v21
        with:
          repositories: ''
          servers: ''
      - name: Wait for MinIO ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO 未在预期时间内启动完成" >&2
          exit 1
      - name: Report Coverage to Coveralls for Pull Requests
        if: github.event_name == 'pull_request'
        run: mvn clean test jacoco:report coveralls:report -Dlicense.skip=true -DrepoToken=$GITHUB_TOKEN -DserviceName=github -DpullRequest=$PR_NUMBER -B package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
      - name: Report Coverage to Coveralls for General Push
        if: github.event_name == 'push'
        run: mvn clean test jacoco:report coveralls:report -Dlicense.skip=true -DrepoToken=$GITHUB_TOKEN -DserviceName=github -B package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      - name: package
        if: github.event_name == 'push'
        run: mvn clean test -Dlicense.skip=true -DrepoToken=$GITHUB_TOKEN -DserviceName=github -B package --file pom.xml
      # 获取当前版本
      - name: extract version
        id: get-version
        run: |
          RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
      # 获取上一个版本
      - name: Get latest tag
        id: get-latest-tag
        run: |
          LAST_VERSION=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "LAST_VERSION=$LAST_VERSION" >> $GITHUB_ENV
      # 监听版本变化
      - name: Check if version changed
        id: version_changed
        run: |
          if [ "${{ env.RELEASE_VERSION }}" == "${{ env.LAST_VERSION }}" ]; then
            echo "version_changed=false" >> $GITHUB_ENV
          else
            echo "version_changed=true" >> $GITHUB_ENV
          fi
      # 将打包好的 Jar 包 放到 staging 文件夹
      - run: mkdir staging && cp target/*.jar staging
      # 发布release
      - uses: ncipollo/release-action@v1
        if: env.version_changed == 'true'
        with:
          allowUpdates: true
          artifacts: "staging/*.jar"
          name: "v${{ env.RELEASE_VERSION }}"
          tag: "${{ env.RELEASE_VERSION }}"
          commit: "main"
          bodyFile: "document/release.md"
          token: "${{ secrets.RELEASE_TOKEN }}"
