name: deploy

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release artifacts
        run: mvn -B -ntp -DskipTests -Prelease package

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            oss-spring-boot3-starter/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21 for Maven Central
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTER_USERNAME
          server-password: CENTER_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        run: mvn -B -ntp -DskipTests -Prelease deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTER_USERNAME: ${{ secrets.CENTER_USERNAME }}
          CENTER_PASSWORD: ${{ secrets.CENTER_PASSWORD }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-assets

      - name: Extract tag version
        id: tag
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Prepare release changelog
        id: changelog
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          normalized_version="${version#v}"
          changelog_file="CHANGELOG.md"
          release_notes_file="release-notes.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "未找到 CHANGELOG.md" > "$release_notes_file"
            exit 0
          fi

          awk -v version="$version" -v normalized_version="$normalized_version" '
            BEGIN { capture = 0 }
            $0 ~ "^## \\[" version "\\]" || $0 ~ "^## \\[" normalized_version "\\]" { capture = 1 }
            capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" && $0 !~ "^## \\[" normalized_version "\\]" { exit }
            capture { print }
          ' "$changelog_file" > "$release_notes_file"

          if [[ ! -s "$release_notes_file" ]]; then
            {
              echo "## $version"
              echo
              echo "CHANGELOG.md 中未找到匹配当前标签的发布说明。"
            } > "$release_notes_file"
          fi

          echo "path=$release_notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: release-assets/*
