name: deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # 发布 Reactor 只保留根父 POM 与 17 个运行时模块，避免 testing/* 与 samples/* 混入发布链路。
  RELEASE_REACTOR: oss-domain,oss-web-api,oss-core,oss-spring-javax-web-support,oss-spring-jakarta-web-support,oss-spring-boot2-autoconfigure,oss-spring-boot3-autoconfigure,oss-spring-boot4-autoconfigure,oss-spring-boot2-starter,oss-spring-boot3-starter,oss-spring-boot4-starter,oss-spring-boot2-web-starter,oss-spring-boot3-web-starter,oss-spring-boot4-web-starter,oss-spring-boot2-openapi-starter,oss-spring-boot3-openapi-starter,oss-spring-boot4-openapi-starter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "手动发布只能从 main 分支触发，当前 ref: ${GITHUB_REF}" >&2
              exit 1
            fi
            exit 0
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布标签必须使用 v<major>.<minor>.<patch> 格式，当前标签: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "发布标签 ${GITHUB_REF_NAME} 必须指向已经合并到 main 的提交" >&2
            exit 1
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release artifacts
        run: mvn -B -ntp -pl "$RELEASE_REACTOR" -am -Dmaven.test.skip=true -Prelease package

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            oss-spring-boot2-starter/target/*.jar
            oss-spring-boot2-web-starter/target/*.jar
            oss-spring-boot2-openapi-starter/target/*.jar
            oss-spring-boot3-starter/target/*.jar
            oss-spring-boot3-web-starter/target/*.jar
            oss-spring-boot3-openapi-starter/target/*.jar
            oss-spring-boot4-starter/target/*.jar
            oss-spring-boot4-web-starter/target/*.jar
            oss-spring-boot4-openapi-starter/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK 21 for Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTER_USERNAME
          server-password: CENTER_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        run: mvn -B -ntp -pl "$RELEASE_REACTOR" -am -Dmaven.test.skip=true -Prelease deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTER_USERNAME: ${{ secrets.CENTER_USERNAME }}
          CENTER_PASSWORD: ${{ secrets.CENTER_PASSWORD }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-assets

      - name: Extract tag version
        id: tag
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Prepare release changelog
        id: changelog
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          normalized_version="${version#v}"
          changelog_file="CHANGELOG.md"
          release_notes_file="release-notes.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "未找到 CHANGELOG.md" > "$release_notes_file"
            exit 0
          fi

          awk -v version="$version" -v normalized_version="$normalized_version" '
            BEGIN { capture = 0 }
            $0 ~ "^## \\[" version "\\]" || $0 ~ "^## \\[" normalized_version "\\]" { capture = 1 }
            capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" && $0 !~ "^## \\[" normalized_version "\\]" { exit }
            capture { print }
          ' "$changelog_file" > "$release_notes_file"

          if [[ ! -s "$release_notes_file" ]]; then
            {
              echo "## $version"
              echo
              echo "CHANGELOG.md 中未找到匹配当前标签的发布说明。"
            } > "$release_notes_file"
          fi

          echo "path=$release_notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: release-assets/*
