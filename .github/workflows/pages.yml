name: GitHub Pages

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/pages.yml'
      - 'samples/sample-frontend-web/**'
      - 'README.md'
      - 'samples/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: samples/sample-frontend-web/package-lock.json

      - name: Install front-end dependencies
        working-directory: samples/sample-frontend-web
        run: npm ci

      - name: Build front-end demo
        working-directory: samples/sample-frontend-web
        env:
          VITE_API_BASE_URL: ${{ vars.SAMPLE_FRONTEND_API_BASE_URL }}
          # 仓库页部署必须显式把子路径传给 Vite；
          # configure-pages 暴露的是 step output `base_path`，而不是 shell 变量 `$BASE_URL`。
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "GitHub Pages 基路径: $VITE_BASE_PATH"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: samples/sample-frontend-web/dist

  deploy-page:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-page
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
